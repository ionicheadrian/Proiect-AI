<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .emoji {
            font-size: 1.2em;
        }

        .section {
            display: none;
            animation: fadeIn 0.3s ease-in;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #2c3e50;
            font-weight: 600;
            font-size: 1.1em;
        }

        select, textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn {
            width: 100%;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(56, 239, 125, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .question-box {
            background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 5px solid #667eea;
        }

        .question-box p {
            color: #2c3e50;
            line-height: 1.6;
            font-size: 1.05em;
        }

        .result-section {
            text-align: center;
        }

        .score {
            font-size: 5em;
            font-weight: bold;
            margin: 30px 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score.excellent {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score.good {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score.poor {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .feedback {
            font-size: 2em;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .answer-comparison {
            text-align: left;
            margin: 30px 0;
        }

        .answer-box {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .answer-box h3 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .correct-answer {
            background: #d5f4e6;
            border-left: 5px solid #38ef7d;
        }

        .user-answer {
            background: #e3f2fd;
            border-left: 5px solid #667eea;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-style: italic;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Quiz Generator</h1>

        <!-- Category Selection -->
        <div id="category-section" class="section active">
            <div class="form-group">
                <label for="category">Select Category:</label>
                <select id="category">
                    <option value="">Choose a category...</option>
                    <option value="n-queens">N-Queens</option>
                    <option value="generalised_hanoi">Generalised Hanoi</option>
                    <option value="graph_coloring">Graph Coloring</option>
                    <option value="knights_tour">Knights Tour</option>
                    <option value="csp_backtracking">CSP Backtracking</option>
                    <option value="minmax_alphabeta">MinMax AlphaBeta</option>
                    <option value="game_theory">Game Theory</option>
                </select>
            </div>
            <button id="generate-btn" class="btn btn-primary">Generate Question</button>
            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Generating your quiz question...</p>
            </div>
        </div>

        <!-- Question Section -->
        <div id="question-section" class="section">
            <div class="question-box">
                <label>Question:</label>
                <p id="question-text"></p>
            </div>
            <div class="form-group">
                <label for="user-answer">Your Answer:</label>
                <textarea id="user-answer" placeholder="Type your answer here..."></textarea>
            </div>
            <button id="submit-btn" class="btn btn-success">Submit Answer</button>
        </div>

        <!-- Result Section -->
        <div id="result-section" class="section">
            <div class="result-section">
                <h2>Results</h2>
                <div id="score" class="score"></div>
                <div id="feedback" class="feedback"></div>
            </div>
            <div class="answer-comparison">
                <div class="answer-box correct-answer">
                    <h3>Correct Answer:</h3>
                    <p id="correct-answer-text"></p>
                </div>
                <div class="answer-box user-answer">
                    <h3>Your Answer:</h3>
                    <p id="user-answer-text"></p>
                </div>
            </div>
            <button id="try-again-btn" class="btn btn-secondary">Try Another Question</button>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
